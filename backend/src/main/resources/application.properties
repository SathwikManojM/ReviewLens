spring.application.name=reviewlens
server.port=8080

# Optional .env files (KEY=value). The project-root .env is shared by start-all.ps1.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------- MongoDB ----------
# Local MongoDB by default. For MongoDB Atlas set MONGODB_URI=mongodb+srv://<user>:<password>@<cluster>/
# Both property names are set so the configuration works with the Boot 4 (spring.mongodb.*)
# and the earlier (spring.data.mongodb.*) property names.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000}
spring.mongodb.database=${MONGODB_DATABASE:reviewlens}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000}
spring.data.mongodb.database=${MONGODB_DATABASE:reviewlens}
spring.data.mongodb.auto-index-creation=true

# ---------- Uploads (hard ceiling; the admin-configurable limit is enforced in code) ----------
spring.servlet.multipart.max-file-size=6GB
spring.servlet.multipart.max-request-size=6GB

# ---------- ReviewLens ----------
reviewlens.nlp.url=${NLP_SERVICE_URL:${NLP_URL:http://localhost:8000}}
reviewlens.nlp.batch-size=100
# No default secret: if JWT_SECRET is missing a random per-process secret is generated (sessions end on restart).
reviewlens.jwt.secret=${JWT_SECRET:}
reviewlens.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
reviewlens.jwt.admin-expiration-hours=${JWT_ADMIN_EXPIRATION_HOURS:8}
reviewlens.upload-dir=${UPLOAD_DIR:uploads}
reviewlens.reports-dir=${REPORTS_DIR:reports}
reviewlens.default-max-reviews=${MAX_REVIEWS:50000}
reviewlens.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# First administrator (created once, only while no administrator exists).
reviewlens.admin.email=${ADMIN_EMAIL:}
reviewlens.admin.password=${ADMIN_PASSWORD:}
reviewlens.admin.name=${ADMIN_NAME:Administrator}


