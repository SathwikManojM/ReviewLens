spring.application.name=reviewlens
server.port=8080

# ---------- MySQL (default) ----------
# Override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reviewlens?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

# ---------- ReviewLens ----------
reviewlens.nlp.url=${NLP_URL:http://localhost:8000}
reviewlens.nlp.batch-size=100
reviewlens.jwt.secret=${JWT_SECRET:change-me-reviewlens-dev-secret-key-at-least-32-bytes-long}
reviewlens.jwt.expiration-hours=24
reviewlens.upload-dir=${UPLOAD_DIR:uploads}
reviewlens.max-reviews-per-dataset=${MAX_REVIEWS:50000}
reviewlens.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
