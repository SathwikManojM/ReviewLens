# Optional local profile that needs no MySQL server: run with  --spring.profiles.active=h2
spring.datasource.url=jdbc:h2:file:./data/reviewlens;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
